[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = espidf
monitor_speed = 115200
; esptool 4.5.1's flasher stub drops the S3's USB Serial/JTAG link right
; after it starts, so flash through the ROM loader instead.
upload_flags = --no-stub
platform_packages =
    platformio/tool-cmake@3.30.2
